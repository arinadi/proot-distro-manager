[mypy]
# This code only ever runs on Termux, so check it as Linux. Without this,
# running mypy from a Windows machine reports os.killpg, signal.SIGKILL and
# socket.AF_UNIX as undefined — true there, irrelevant here.
platform = linux

ignore_missing_imports = True

# Enough to catch the mistakes that have actually shipped: calling a name that
# lives in another module, and passing the wrong shape to a library. Not full
# strictness — annotating this codebase throughout would cost more attention
# than it returns.
warn_unused_ignores = True
