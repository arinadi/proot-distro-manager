name: Build PDM Image

on:
  push:
    branches: [main]
    paths:
      - 'image/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    # `secrets` is not a valid context inside a step `if:` — GitHub rejects
    # the whole workflow file at parse time if it's referenced there ("workflow
    # file issue", 0 jobs scheduled). Mirroring the secret into env: first
    # works around that, since `env` is allowed in `if:`.
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional mirror. GHCR has no pull-rate limit for a public package
      # and stays the primary registry (installer/const.py); Docker Hub is
      # the automatic fallback for the ISPs where ghcr.io's CDN routes
      # badly. Building this in is a no-op until DOCKERHUB_USERNAME and
      # DOCKERHUB_TOKEN (an access token, not the account password) are
      # added as repo secrets — everything below degrades to GHCR-only.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU (for ARM64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate tag
        id: tag
        run: echo "tag=$(date -u +'%Y%m%d').$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Determine tags
        id: meta
        run: |
          {
            echo "tags<<EOF"
            echo "ghcr.io/${{ github.repository_owner }}/pdm:latest"
            echo "ghcr.io/${{ github.repository_owner }}/pdm:${{ steps.tag.outputs.tag }}"
            if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              echo "${{ github.repository_owner }}/pdm:latest"
              echo "${{ github.repository_owner }}/pdm:${{ steps.tag.outputs.tag }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./image
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            repos/${{ github.repository_owner }}/proot-distro-manager/packages/container/pdm \
            -f visibility=public || echo "Package may already be public"
